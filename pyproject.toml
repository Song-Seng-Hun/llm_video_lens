[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-image-lens"
version = "0.1.0"
description = "Source-bound video shot inspection and compact LLM briefs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
core = ["numpy==2.2.6", "opencv-python-headless==4.12.0.88", "Pillow==13.0.0"]
tracking = ["numpy==2.2.6", "opencv-python-headless==4.12.0.88", "Pillow==13.0.0", "torch==2.9.0"]

[project.scripts]
image-lens = "image_lens.cli:main"

[tool.setuptools.packages.find]
include = ["image_lens"]

[tool.setuptools.package-data]
image_lens = ["*.json", "vendor/*.json", "vendor/shot-detector/scenedetect/**/*.py", "vendor/shot-detector/scenedetect/*.py", "vendor/shot-detector/scenedetect-0.6.7.1.dist-info/licenses/LICENSE", "vendor/source/**/*.py", "vendor/source/*.md"]
