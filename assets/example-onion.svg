<svg xmlns="http://www.w3.org/2000/svg" viewBox="54 26 532 300" width="640" height="360" role="img" aria-labelledby="t d"><title id="t">Onion picture (illustration)</title><desc id="d">An illustration of a look onion picture, drawn by hand rather than taken from a video: a dancer facing the viewer, the start pose in cyan and the end pose in red overlaid. A blue dotted trail follows the right wrist from shoulder height across the body to the left shoulder and down to the chest; a yellow trail follows the left ankle out to the side and up. Each trail starts at a circle and ends at a square.</desc>
